<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Ledger</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <h1>Project Ledger</h1>
  <div class="month-selector">
    <label for="month-input">Month</label>
    <input type="month" id="month-input" />
  </div>
</header>

<main>

  <!-- Summary -->
  <section class="card summary-card">
    <div class="summary-grid">
      <div class="summary-item">
        <span class="summary-label">Income</span>
        <span class="summary-value income" id="summary-income">₹0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Expenses</span>
        <span class="summary-value expense" id="summary-expenses">₹0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Invested</span>
        <span class="summary-value investment" id="summary-investments">₹0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Available</span>
        <span class="summary-value available" id="summary-available">₹0</span>
      </div>
    </div>
  </section>

  <!-- Add transaction forms -->
  <section class="card">
    <div class="tabs">
      <button class="tab-button active" data-tab="expense-form">Add Expense</button>
      <button class="tab-button" data-tab="income-form">Add Income</button>
      <button class="tab-button" data-tab="investment-form">Add Investment</button>
    </div>

    <form id="expense-form" class="tab-panel active">
      <div class="form-row">
        <label for="expense-category">Category</label>
        <select id="expense-category">
          <option>Food</option>
          <option>Travel</option>
          <option>Entertainment</option>
          <option>Gadgets</option>
          <option>Education</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-row autocomplete-wrapper">
        <label for="expense-description">Description</label>
        <input type="text" id="expense-description" placeholder="e.g. Lunch" autocomplete="off" />
        <ul id="expense-suggestions" class="suggestions-list" hidden></ul>
      </div>
      <div class="form-row">
        <label for="expense-amount">Amount (₹)</label>
        <input type="number" id="expense-amount" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-row">
        <label for="expense-date">Date</label>
        <input type="date" id="expense-date" />
      </div>
      <div class="form-actions">
        <button type="submit" class="save-button">Save Expense</button>
        <button type="button" class="cancel-edit-button" id="expense-cancel-edit" hidden>Cancel edit</button>
      </div>
      <p class="form-error" id="expense-error"></p>
    </form>

    <form id="income-form" class="tab-panel">
      <div class="form-row">
        <label for="income-type">Type</label>
        <select id="income-type">
          <option>Salary</option>
          <option>Gift</option>
          <option>Freelance</option>
          <option>Scholarship</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-row">
        <label for="income-amount">Amount (₹)</label>
        <input type="number" id="income-amount" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-row">
        <label for="income-date">Date</label>
        <input type="date" id="income-date" />
      </div>
      <div class="form-actions">
        <button type="submit" class="save-button">Save Income</button>
        <button type="button" class="cancel-edit-button" id="income-cancel-edit" hidden>Cancel edit</button>
      </div>
      <p class="form-error" id="income-error"></p>
    </form>

    <form id="investment-form" class="tab-panel">
      <div class="form-row">
        <label for="investment-type">Type</label>
        <select id="investment-type">
          <option>Stock</option>
          <option>Mutual Fund</option>
          <option>FD</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-row">
        <label for="investment-amount">Amount (₹)</label>
        <input type="number" id="investment-amount" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-row">
        <label for="investment-date">Date</label>
        <input type="date" id="investment-date" />
      </div>
      <div class="form-actions">
        <button type="submit" class="save-button">Save Investment</button>
        <button type="button" class="cancel-edit-button" id="investment-cancel-edit" hidden>Cancel edit</button>
      </div>
      <p class="form-error" id="investment-error"></p>
    </form>
  </section>

  <!-- Expense categories -->
  <section class="card">
    <h2>Expense Categories</h2>
    <div id="category-list" class="category-list">
      <p class="empty-message">No expenses recorded for this month yet.</p>
    </div>
  </section>

  <!-- Financial Insights -->
  <section class="card">
    <h2>Financial Insights</h2>
    <div class="insights-controls">
      <div class="form-row">
        <label for="insights-show">Show</label>
        <select id="insights-show">
          <option value="expenses">Expenses</option>
          <option value="income">Income</option>
          <option value="investments">Investments</option>
          <option value="available">Available Money</option>
          <option value="income_vs_expenses">Income vs Expenses</option>
        </select>
      </div>
      <div class="form-row">
        <label for="insights-period">Period</label>
        <select id="insights-period">
          <option value="this_month">This Month</option>
          <option value="last_3_months">Last 3 Months</option>
          <option value="last_6_months">Last 6 Months</option>
          <option value="this_year">This Year</option>
        </select>
      </div>
      <div class="form-row">
        <label>View</label>
        <div class="view-toggle" id="insights-view-toggle">
          <button type="button" class="view-button" data-view="bar">Bar</button>
          <button type="button" class="view-button" data-view="line">Line</button>
          <button type="button" class="view-button" data-view="pie">Pie</button>
        </div>
      </div>
    </div>
    <div id="insights-chart-container" class="insights-chart-container">
      <p class="empty-message">Loading...</p>
    </div>
    <p class="form-error" id="insights-error"></p>
  </section>

  <!-- Transactions -->
  <section class="card">
    <h2>Transactions</h2>
    <div id="transaction-list" class="transaction-list">
      <p class="empty-message">No transactions recorded for this month yet.</p>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
